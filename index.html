<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>My Cookbook</title>
<meta name="description" content="A growing personal collection of recipes, with adjustable servings and a guided cooking mode." />
<meta name="theme-color" content="#F7F3EA" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%23F7F3EA'/><path d='M6 34 A26 26 0 0 1 58 34 Z' fill='%234B6A45'/><path d='M11 34 A21 21 0 0 1 53 34 Z' fill='%23C1442E'/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F7F3EA;
    --paper-dark: #EDE6D6;
    --card: #FFFDF8;
    --ink: #2B3226;
    --ink-soft: #5B6355;
    --basil: #4B6A45;
    --brick: #B4472F;
    --mustard: #D2A03D;
    --line: #D8CFB8;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    background: var(--paper);
    background-image: repeating-linear-gradient(180deg, transparent, transparent 27px, rgba(43,50,38,0.035) 28px);
    font-family: 'Work Sans', system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 900px; margin: 0 auto; padding: 44px 20px 60px; }

  /* ---------- Header ---------- */
  header.masthead { margin-bottom: 30px; }
  .eyebrow {
    font-size: 12px; letter-spacing: 2px; color: var(--brick);
    font-weight: 700; text-transform: uppercase;
  }
  h1.title {
    font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 600;
    font-size: clamp(32px, 7vw, 42px); margin: 6px 0 8px; color: var(--ink);
  }
  .subtitle { color: var(--ink-soft); font-size: 15px; max-width: 480px; margin: 0; line-height: 1.5; }

  /* ---------- Search ---------- */
  .searchbar { position: relative; margin: 22px 0 26px; }
  .searchbar input {
    width: 100%; padding: 12px 16px 12px 40px; border-radius: 24px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    font-family: inherit; font-size: 15px; outline: none;
  }
  .searchbar input:focus { border-color: var(--basil); box-shadow: 0 0 0 3px rgba(75,106,69,0.12); }
  .searchbar svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); opacity: 0.5; }
  .count { font-size: 12.5px; color: var(--ink-soft); margin: -14px 0 18px 4px; }

  /* ---------- Categories & cards ---------- */
  .category { margin-top: 32px; }
  .category:first-of-type { margin-top: 4px; }
  .category-title {
    font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 18px;
    margin: 0 0 14px; display: flex; align-items: baseline; gap: 8px; color: var(--ink);
  }
  .category-count {
    font-family: 'Work Sans', sans-serif; font-weight: 600; font-size: 12px; color: var(--ink-soft);
  }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px;
  }
  .card {
    text-align: left; background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 20px; cursor: pointer; display: flex;
    flex-direction: column; gap: 14px; box-shadow: 0 1px 0 rgba(43,50,38,0.04);
    transition: transform .15s ease, box-shadow .15s ease; font: inherit; color: inherit;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-2px); box-shadow: 0 6px 16px rgba(43,50,38,0.08); outline: none;
  }
  .card:focus-visible { border-color: var(--basil); }
  .badge {
    width: 52px; height: 52px; border-radius: 12px; background: var(--paper-dark);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .card-media {
    margin: -20px -20px 0; aspect-ratio: 16 / 10; border-radius: 16px 16px 0 0;
    overflow: hidden; background: var(--paper-dark);
  }
  .card-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-title { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 19px; line-height: 1.25; }
  .card-tagline { font-size: 13.5px; color: var(--ink-soft); margin-top: 5px; line-height: 1.45; }
  .card-meta { font-size: 12px; font-weight: 600; margin-top: auto; }
  .empty { color: var(--ink-soft); font-size: 15px; padding: 30px 4px; }

  /* ---------- Detail ---------- */
  .detail { max-width: 720px; margin: 0 auto; }
  .back {
    background: none; border: none; font: inherit; font-size: 14px;
    color: var(--ink-soft); cursor: pointer; padding: 6px 0;
  }
  .back:hover { color: var(--ink); }
  .detail-head { display: flex; align-items: flex-start; gap: 16px; margin-top: 18px; }
  .detail-badge {
    width: 60px; height: 60px; border-radius: 14px; background: var(--paper-dark);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .detail-media { margin: 18px 0 0; }
  .detail-media img {
    width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 16px; display: block;
    background: var(--paper-dark);
  }
  .img-credit { font-size: 11px; color: var(--ink-soft); margin: 6px 2px 0; text-align: right; }
  .img-credit a { color: inherit; }
  h2.detail-title {
    font-family: 'Fraunces', Georgia, serif; font-weight: 700;
    font-size: clamp(24px, 5vw, 30px); margin: 0; line-height: 1.2;
  }
  .detail-tagline { color: var(--ink-soft); margin: 6px 0 0; font-size: 15px; line-height: 1.45; }
  .allergens { color: var(--brick); margin: 6px 0 0; font-size: 12.5px; font-weight: 600; }
  .source-link {
    display: inline-block; margin-top: 8px; font-size: 13px;
    color: var(--brick); text-decoration: underline;
  }

  .toolbar {
    display: flex; justify-content: space-between; align-items: center;
    margin: 24px 0 8px; padding-bottom: 14px; border-bottom: 1px solid var(--line);
    flex-wrap: wrap; gap: 12px;
  }
  .servings { display: flex; align-items: center; gap: 10px; }
  .servings-label { font-size: 13px; color: var(--ink-soft); letter-spacing: .3px; }
  .circle {
    width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--paper); color: var(--ink); font-size: 16px; line-height: 1;
    cursor: pointer; font-family: inherit; display: inline-flex;
    align-items: center; justify-content: center;
  }
  .circle:hover { background: var(--paper-dark); }
  .servings-num {
    font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 18px;
    min-width: 24px; text-align: center;
  }
  .reset {
    font-size: 12px; color: var(--ink-soft); background: none; border: none;
    text-decoration: underline; cursor: pointer; padding: 0; font-family: inherit;
  }
  .cook-btn {
    color: var(--paper); border: none; border-radius: 22px; padding: 10px 20px;
    font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap;
  }

  .section-label {
    font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: var(--ink-soft);
    text-transform: uppercase; margin: 0 0 12px;
  }
  ul.ingredients { list-style: none; padding: 0; margin: 0; }
  ul.ingredients li {
    display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line);
    font-size: 15px; line-height: 1.4;
  }
  .amt { font-weight: 600; min-width: 68px; flex-shrink: 0; }
  ol.steps { padding: 0; margin: 0; list-style: none; }
  ol.steps li { display: flex; gap: 14px; margin-bottom: 18px; }
  .step-num {
    width: 26px; height: 26px; border-radius: 50%; color: var(--paper);
    font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 13px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px;
  }
  .step-title { font-weight: 600; font-size: 15px; }
  .step-time { font-weight: 400; color: var(--ink-soft); font-size: 13px; }
  .step-body { font-size: 14px; color: var(--ink-soft); margin-top: 2px; line-height: 1.5; }
  .notes {
    margin-top: 26px; padding: 14px 16px; background: var(--paper-dark);
    border-left: 3px solid var(--mustard); border-radius: 4px;
    font-size: 14px; color: var(--ink-soft); line-height: 1.5;
  }
  .notes strong { color: var(--ink); }

  /* ---------- Cooking mode ---------- */
  .cooking {
    position: fixed; inset: 0; background: var(--ink); color: var(--paper);
    display: flex; flex-direction: column; z-index: 50;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .cooking-top {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 24px; gap: 12px;
  }
  .cooking-name { font-family: 'Fraunces', Georgia, serif; font-size: 15px; opacity: .8; }
  .exit-btn {
    background: none; border: 1px solid rgba(247,243,234,.35); color: var(--paper);
    border-radius: 20px; padding: 6px 14px; font-family: inherit; font-size: 13px;
    cursor: pointer; white-space: nowrap;
  }
  .dots { display: flex; justify-content: center; gap: 6px; padding: 4px 16px 8px; flex-wrap: wrap; }
  .dot { width: 8px; height: 8px; border-radius: 4px; background: rgba(247,243,234,.2); transition: width .2s; }
  .dot.done { background: var(--mustard); }
  .dot.current { width: 22px; background: var(--mustard); }
  .cooking-body {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 20px 32px; text-align: center; overflow-y: auto;
  }
  .step-counter { font-size: 13px; letter-spacing: 1.5px; opacity: .6; margin-bottom: 10px; }
  .cooking-title {
    font-family: 'Fraunces', Georgia, serif; font-weight: 600;
    font-size: clamp(24px, 5vw, 40px); margin: 0 0 18px; max-width: 640px; line-height: 1.15;
  }
  .cooking-text { font-size: clamp(16px, 2.4vw, 20px); line-height: 1.55; max-width: 560px; opacity: .9; margin: 0; }
  .timer-wrap { margin-top: 28px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .timer-digits { font-family: 'Fraunces', Georgia, serif; font-size: 44px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .timer-digits.done { color: var(--mustard); }
  .timer-btn {
    background: var(--mustard); color: var(--ink); border: none; border-radius: 24px;
    padding: 10px 24px; font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .timer-btn:disabled { opacity: .5; cursor: default; }
  .cooking-nav { display: flex; justify-content: space-between; padding: 20px 24px 32px; gap: 12px; }
  .nav-btn {
    border: none; border-radius: 24px; padding: 12px 26px; font-family: inherit;
    font-weight: 600; font-size: 15px; color: var(--paper);
    background: rgba(247,243,234,.13); cursor: pointer;
  }
  .nav-btn:disabled { opacity: .35; cursor: default; }
  .nav-next { background: var(--brick); }
  .nav-done { background: var(--basil); }

  footer.foot {
    margin-top: 46px; padding-top: 18px; border-top: 1px solid var(--line);
    font-size: 12.5px; color: var(--ink-soft);
  }

  @media print {
    .toolbar, .back, .searchbar, .count, footer.foot, .img-credit { display: none !important; }
    body { background: #fff; }
  }
</style>
</head>
<body>
  <div class="wrap" id="app"></div>
  <div id="overlay"></div>
  <script src="recipes.js"></script>
  <script src="app.js"></script>
</body>
</html>
